workflows:
  android-apk:
    name: Dhikr APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: 1 check
        script: |
          ls -la
          ls -la www || true
          if ! grep -q "dhikr-app-v1" www/index.html 2>/dev/null; then
            echo "ERROR: الملف www/index.html غير موجود أو ليس ملف تطبيق ذكر"
            exit 1
          fi
      - name: 2 project files
        script: |
          cat > package.json <<'JSON'
          {
            "name": "dhikr",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.6.2",
              "@capacitor/core": "8.6.2",
              "@capacitor/haptics": "8.0.2",
              "@capacitor/local-notifications": "8.3.1"
            },
            "devDependencies": {
              "@capacitor/assets": "4.0.0",
              "@capacitor/cli": "8.6.2"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.swalaf.dhikr",
            "appName": "ذِكْر",
            "webDir": "www",
            "android": {
              "backgroundColor": "#03140F"
            },
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_dhikr",
                "iconColor": "#10B981"
              },
              "SystemBars": {
                "insetsHandling": "css"
              }
            }
          }
          JSON
          cat package.json capacitor.config.json
      - name: 3 npm install
        script: npm install
      - name: 4 android
        script: npx cap add android
      - name: 5 icons and fonts
        script: |
          python3 - <<'PY'
          # يولّد أيقونات التطبيق وأصواته بدون أي مكتبات خارجية.
          # التشغيل: python3 tool/make_assets.py
          import math, os, struct, wave, zlib

          os.makedirs('assets', exist_ok=True)

          # ---------------- PNG ----------------
          def write_png(path, w, h, pixels):
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  raw.extend(pixels[y * w * 4:(y + 1) * w * 4])
              def chunk(t, d):
                  c = struct.pack('>I', len(d)) + t + d
                  return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
              open(path, 'wb').write(png)

          def smooth(edge, d, aa=1.2):
              v = (edge - d) / aa + 0.5
              return 0.0 if v <= 0 else 1.0 if v >= 1 else v

          def over(dst, src, a):
              return [dst[i] * (1 - a) + src[i] * a for i in range(3)], dst[3] + (1 - dst[3]) * a

          def render(S, scale=1.0, background=True):
              c = S / 2
              R = S * 0.30 * scale
              rr = R * 1.18
              br = S * 0.013 * scale
              n = 33
              px = bytearray(S * S * 4)
              for y in range(S):
                  for x in range(S):
                      dx, dy = x - c + 0.5, y - c + 0.5
                      d = math.hypot(dx, dy)
                      if background:
                          t = min(d / (S * 0.72), 1)
                          col, a = [10 * (1 - t) + 3 * t, 52 * (1 - t) + 18 * t, 40 * (1 - t) + 14 * t], 1.0
                      else:
                          col, a = [0, 0, 0], 0.0
                      # توهّج
                      g = max(0.0, 1 - max(0.0, d - R) / (R * 0.5)) * 0.55 if d > R * 0.9 else 0
                      if g > 0:
                          col, a = over(col + [a], [16, 185, 129], g)
                      # الدائرة الخارجية والداخلية
                      k = smooth(R, d)
                      if k > 0:
                          col, a = over(col + [a], [16, 160, 112], k)
                      k = smooth(R * 0.86, d)
                      if k > 0:
                          col, a = over(col + [a], [8, 95, 68], k)
                      k = smooth(R * 0.22, d)
                      if k > 0:
                          col, a = over(col + [a], [232, 196, 110], k)
                      # حبات السبحة
                      if abs(d - rr) < br + 2:
                          ang = math.atan2(dy, dx) + math.pi / 2
                          i = round(ang / (2 * math.pi / n))
                          ba = i * 2 * math.pi / n - math.pi / 2
                          bd = math.hypot(dx - rr * math.cos(ba), dy - rr * math.sin(ba))
                          k = smooth(br, bd)
                          if k > 0:
                              col, a = over(col + [a], [232, 196, 110], k)
                      o = (y * S + x) * 4
                      px[o:o + 4] = bytes([int(min(255, max(0, v))) for v in col] + [int(a * 255)])
              return px


          S = 1024
          write_png('assets/icon-only.png', S, S, render(S))
          write_png('assets/icon-foreground.png', S, S, render(S, 0.62, False))
          bg = bytearray(S * S * 4)
          for i in range(S * S):
              bg[i*4:i*4+4] = bytes([3, 20, 15, 255])
          write_png('assets/icon-background.png', S, S, bg)
          write_png('assets/splash.png', S, S, render(S, 0.55, True))
          write_png('assets/splash-dark.png', S, S, render(S, 0.55, True))

          # أيقونة الإشعار (أبيض على شفاف)
          N = 96
          px = bytearray(N * N * 4)
          for y in range(N):
              for x in range(N):
                  d = math.hypot(x - 47.5, y - 47.5)
                  a = max(smooth(34, d) - smooth(26, d), smooth(10, d))
                  px[(y * N + x) * 4:(y * N + x) * 4 + 4] = bytes([255, 255, 255, int(a * 255)])
          os.makedirs('android/app/src/main/res/drawable', exist_ok=True)
          write_png('android/app/src/main/res/drawable/ic_stat_dhikr.png', N, N, px)
          print('assets ready')
          PY
          mkdir -p www/fonts
          F=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL $F/amiri/Amiri-Regular.ttf -o www/fonts/Amiri-Regular.ttf
          curl -fsSL $F/amiri/Amiri-Bold.ttf -o www/fonts/Amiri-Bold.ttf
          for w in Regular Medium Bold ExtraBold; do
            curl -fsSL $F/tajawal/Tajawal-$w.ttf -o www/fonts/Tajawal-$w.ttf
          done
          npx @capacitor/assets generate --android --iconBackgroundColor '#03140F' --iconBackgroundColorDark '#03140F' --splashBackgroundColor '#03140F' --splashBackgroundColorDark '#03140F'
          ls www/fonts android/app/src/main/res/drawable
      - name: 6 sync
        script: npx cap sync android
      - name: 7 build apk
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
